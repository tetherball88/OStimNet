name: tton_sex_stop_diary
description: Reaction when OStim Ended
eventCriteria:
  eventType: tton_event
  schemaConditions:
    - fieldPath: tton_type
      operator: equals
      value: sex_stop
      caseSensitive: false
    - fieldPath: skipTrigger
      operator: equals
      value: false
audience: nearby_npcs
response:
  type: diary_entry
  content: "{{ event_json.msg }}"
  targetScope: all_nearby_actors
  nearbyRadius: 1100
enabled: false