name: tton_virginity_lost_diary
description: Private diary reflection after an encounter where virginity was lost
eventCriteria:
  eventType: tton_event
  schemaConditions:
    - fieldPath: tton_type
      operator: equals
      value: virginity_lost_diary
      caseSensitive: false
audience: originator
response:
  type: diary_entry
  content: "{{ event_json.msg }} {% if event_json.virginIsOriginator %}Write in your private diary in your own voice about losing your virginity under these circumstances and how you actually feel about the experience{% if event_json.partnerActorName != \"\" %} and {{ event_json.partnerActorName }}{% endif %} based on your personality.{% else %}Write in your private diary in your own voice about this encounter involving {{ event_json.virginActorName }}'s first time and how you actually feel about it based on your personality.{% endif %}"
  targetScope: triggering_actor
enabled: false
cooldownSeconds: 0
priority: 5
