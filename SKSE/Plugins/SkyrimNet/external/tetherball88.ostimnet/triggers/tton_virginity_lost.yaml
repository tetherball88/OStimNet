name: tton_virginity_lost
description: Immediate in-character reaction when an actor loses their virginity during an intimate scene
eventCriteria:
  eventType: tton_event
  schemaConditions:
    - fieldPath: tton_type
      operator: equals
      value: virginity_lost
      caseSensitive: false
    - fieldPath: skipTrigger
      operator: equals
      value: false
    - fieldPath: speaker
      operator: not_equals
      value: ""
audience: nearby_npcs
response:
  type: direct_narration
  content: "{{ event_json.msg }} {% if event_json.virginActorName == originator %}{{ originator }} reacts immediately in character according to her own personality, role (`{{ event_json.virginRole }}`), and the `{{ event_json.intent }}` circumstances of the encounter.{% else %}{{ originator }} reacts immediately in character to this moment with {{ event_json.virginActorName }} given the `{{ event_json.intent }}` circumstances and their respective roles.{% endif %}"
enabled: true
cooldownSeconds: 30
priority: 9
