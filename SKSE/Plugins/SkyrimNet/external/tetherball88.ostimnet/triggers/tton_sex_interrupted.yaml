name: tton_sex_interrupted
description: Immediate NPC reaction when an intimate scene is abruptly interrupted by combat or guard intervention
eventCriteria:
  eventType: tton_event
  schemaConditions:
    - fieldPath: tton_type
      operator: equals
      value: sex_stop
      caseSensitive: false
    - fieldPath: interrupted
      operator: equals
      value: true
    - fieldPath: skipTrigger
      operator: equals
      value: false
    - fieldPath: speaker
      operator: not_equals
      value: ""
audience: nearby_npcs
response:
  type: direct_narration
  content: "{% if event_json.interruptReason == \"arrest\" %}Your intimate encounter was just abruptly busted by law enforcement / crime intervention! {{ originator }} reacts immediately in character to getting caught in the act — shock, embarrassment, frustration, or scrambling for composure.{% else %}Your intimate encounter was just violently interrupted mid-act by sudden combat and danger! {{ originator }} snaps out of passion immediately, reacting in character with alarm, frustration, or battle readiness toward the threat.{% endif %}"
enabled: true
cooldownSeconds: 15
priority: 9
interrupt: true
