name: Release (selective zip)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  make-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # build steps here if needed

      - name: Create selective zips
        run: |
          mkdir -p out
          TAG="${{ github.ref_name }}"

          # 1. SkyrimNet v25 (standard structure)
          zip -r "out/OStimNet_${TAG}_SkyrimNet_v25.zip" \
            Interface/ \
            Scripts/ \
            SKSE/ \
            TT_OStimNet.esp \
            -x ".github/*"

          # 2. SkyrimNet vPre-25 (legacy loose structure)
          mkdir -p staging_pre25
          cp -r Interface Scripts SKSE TT_OStimNet.esp staging_pre25/
          cp -r staging_pre25/SKSE/Plugins/SkyrimNet/external/tetherball88.ostimnet/* staging_pre25/SKSE/Plugins/SkyrimNet/
          rm -rf staging_pre25/SKSE/Plugins/SkyrimNet/external

          (cd staging_pre25 && zip -r "../out/OStimNet_${TAG}_SkyrimNet_vPre-25.zip" \
            Interface/ \
            Scripts/ \
            SKSE/ \
            TT_OStimNet.esp)
          rm -rf staging_pre25

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            out/OStimNet_${{ github.ref_name }}_SkyrimNet_v25.zip
            out/OStimNet_${{ github.ref_name }}_SkyrimNet_vPre-25.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |-
            Automated release for ${{ github.ref_name }}

            ## Release Notes
            See the changelog for full details: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md
          files: |
            out/OStimNet_${{ github.ref_name }}_SkyrimNet_v25.zip
            out/OStimNet_${{ github.ref_name }}_SkyrimNet_vPre-25.zip

