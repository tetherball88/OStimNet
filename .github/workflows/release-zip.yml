name: Release (selective zip)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  make-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # build steps here if needed

      - name: Create selective zip
        run: |
          mkdir -p out
          TAG="${{ github.ref_name }}"

          zip -r "out/OStimNet_${TAG}.zip" \
            Interface/ \
            Scripts/ \
            SKSE/ \
            TT_OStimNet.esp \
            -x ".github/*"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            out/OStimNet_${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |-
            Automated release for ${{ github.ref_name }}

            ## Release Notes
            See the changelog for full details: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md
          files: |
            out/OStimNet_${{ github.ref_name }}.zip

